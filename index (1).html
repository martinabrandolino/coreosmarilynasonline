re Caslon Display',serif;font-size:23px;letter-spacing:-.01em\">Marilynas<\u002Fspan>\n        <span style=\"font-family:'Libre Caslon Display',serif;font-style:italic;font-size:23px;color:#B4552E\">Online<\u002Fspan>\n      <\u002Fspan>\n      <span style=\"font:500 10.5px 'Work Sans',system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(34,30,26,.45)\">Catálogo de coreografías<\u002Fspan>\n    <\u002Fspan>\n    <nav style=\"display:flex;align-items:center;gap:22px\">\n      <a href=\"#faq\" style=\"font:500 12.5px 'Work Sans',system-ui,sans-serif;color:rgba(34,30,26,.6)\">Dudas<\u002Fa>\n      <a href=\"#contacto\" style=\"font:600 12px 'Work Sans',system-ui,sans-serif;background:#221E1A;color:#FAF5EE;padding:10px 18px;border-radius:100px\" style-hover=\"background:#B4552E;color:#FAF5EE\">Escribime<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <main>\n    <section style=\"padding: clamp(30px,7vw,52px) clamp(16px,4vw,28px) 30px; text-align: center; position: static\">\n      \n      <h1 style=\"margin: 0 auto; max-width: 17ch; font-family: 'Libre Caslon Display',serif; font-weight: 400; font-size: clamp(40px,10vw,87px); line-height: 1; letter-spacing: -.02em; text-wrap: balance\">Tus clases, <span style=\"font-style: italic; color: rgb(180, 85, 46);\">resueltas<\u002Fspan><\u002Fh1>\n      <p style=\"max-width: 50.56ch; margin: 22px auto 0; font: 400 15px/1.7 'Work Sans',system-ui,sans-serif; color: rgba(34,30,26,.62); text-wrap: pretty; margin-top: 20px; font-size: 13px; line-height: 1.55; text-align: center; font-weight: 500\">Más de 100 canciones con su coreografía explicada paso a paso.&nbsp;<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"padding:0 clamp(16px,4vw,28px) 16px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:9px;height:42px;padding:0 17px;border-radius:100px;background:#FFFDFA;border:1px solid rgba(34,30,26,.12);min-width:min(250px,100%);flex:1 1 250px;max-width:420px\">\n        <span style=\"font-size:13px;color:rgba(34,30,26,.35)\">⌕<\u002Fspan>\n        <input value=\"{{ query }}\" sc-camel-on-change=\"{{ setQuery }}\" placeholder=\"Buscá por canción o por artista\" style=\"flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 13px 'Work Sans',system-ui,sans-serif;color:#221E1A\">\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n        <sc-for list=\"{{ levels }}\" as=\"lv\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ lv.pick }}\" style=\"{{ lv.style }}\"><span style=\"{{ lv.dotStyle }}\"><\u002Fspan>{{ lv.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:0 clamp(16px,4vw,28px) 16px;display:flex;justify-content:center;gap:14px 22px;flex-wrap:wrap\">\n      <sc-for list=\"{{ legend }}\" as=\"lg\" hint-placeholder-count=\"3\">\n        <span style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.45 'Work Sans',system-ui,sans-serif;color:rgba(34,30,26,.5)\">\n          <span style=\"{{ lg.dotStyle }}\"><\u002Fspan>\n          <span><span style=\"font-weight:600;color:rgba(34,30,26,.75)\">{{ lg.t }}<\u002Fspan> · {{ lg.d }}<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section style=\"padding:0 clamp(16px,4vw,28px)\">\n      <div style=\"background:#FFFDFA;border:1px solid rgba(34,30,26,.1);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(34,30,26,.04),0 12px 32px -18px rgba(34,30,26,.22)\">\n        <div style=\"display:grid;grid-template-columns:14px minmax(0,1fr) 26px;gap:16px;align-items:center;padding:11px clamp(14px,3.5vw,22px);background:#F7F1E8;font:500 9.5px 'Work Sans',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(34,30,26,.42)\">\n          <span><\u002Fspan><span>Canción<\u002Fspan><span><\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list 2.5px 'Work Sans',system-ui,sans-serif\" style-hover=\"background:#E0975F;color:#221E1A\">@marilynasonline <span>→<\u002Fspan><\u002Fa>\n        <a href=\"https://www.instagram.com/marilynasonline/\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openIg }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:15px 22px;border:1px solid rgba(250,245,238,.32);color:#FAF5EE;border-radius:100px;font:600 12.5px 'Work Sans',system-ui,sans-serif\" style-hover=\"background:rgba(250,245,238,.12);color:#FAF5EE\">Mandame un mensajito <span>→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ hasPicks }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;justify-content:center;padding:0 20px 20px;pointer-events:none\">\n    <div style=\"pointer-events:auto;width:100%;max-width:660px;background:#221E1A;color:#FAF5EE;border-radius:20px;padding:18px 22px;box-shadow:0 18px 46px -14px rgba(34,30,26,.55);animation:rise .25s ease both\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n        <div>\n          <p style=\"margin:0;font:600 13.5px 'Work Sans',system-ui,sans-serif\">{{ pickHeadline }}<\u002Fp>\n          <p style=\"margin:4px 0 0;font:400 11.5px/1.5 'Work Sans',system-ui,sans-serif;color:rgba(250,245,238,.6)\">{{ pickHint }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <button sc-camel-on-click=\"{{ copyList }}\" style=\"border:1px solid rgba(250,245,238,.32);background:transparent;color:#FAF5EE;padding:11px 17px;border-radius:100px;cursor:pointer;font:600 12px 'Work Sans',system-ui,sans-serif\">{{ copyLabel }}<\u002Fbutton>\n          <a href=\"https://www.instagram.com/marilynasonline/\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openIg }}\" style=\"background:#E0975F;color:#221E1A;padding:11px 17px;border-radius:100px;font:600 12px 'Work Sans',system-ui,sans-serif;white-space:nowrap\" style-hover=\"background:#FAF5EE;color:#221E1A\">Mandármela →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-top:14px\">\n        <sc-for list=\"{{ picked }}\" as=\"pk\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ pk.remove }}\" style=\"display:flex;align-items:center;gap:8px;background:rgba(250,245,238,.1);border:0;color:#FAF5EE;padding:7px 12px;border-radius:100px;cursor:pointer;font:500 11.5px 'Work Sans',system-ui,sans-serif\" style-hover=\"background:rgba(250,245,238,.2)\">{{ pk.song }} <span style=\"opacity:.55\">✕<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"margin-top:auto;padding:24px clamp(16px,4vw,28px);gap:12px 20px;flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid rgba(34,30,26,.1);font:400 11.5px 'Work Sans',system-ui,sans-serif;color:rgba(34,30,26,.45)\">\n    <span>© 2026 Marilynas Online<\u002Fspan>\n    <span style=\"display:flex;gap:18px\"><a href=\"#faq\" style=\"color:rgba(34,30,26,.45)\">Licencias<\u002Fa><a href=\"#contacto\" style=\"color:rgba(34,30,26,.45)\">Contacto<\u002Fa><\u002Fspan>\n  <\u002Ffooter>\n  <div style=\"{{ footerPad }}\"><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:900}}\">\nconst LIGHT = {Suave:'#3E8E5A', Media:'#DCA318', Alta:'#C1452C'};\nconst HALO  = {Suave:'rgba(62,142,90,.18)', Media:'rgba(220,163,24,.18)', Alta:'rgba(193,69,44,.18)'};\nconst ROW_BASE = 'display:grid;grid-template-columns:14px minmax(0,1fr) 26px;gap:12px;align-items:center;padding:13px clamp(14px,3.5vw,22px);border-bottom:1px solid rgba(34,30,26,.07);cursor:pointer;transition:background .15s;';\n\nfunction dot(intensity, size){\n  const d = size || 14;\n  return 'width:' + d + 'px;height:' + d + 'px;border-radius:50%;flex:none;display:inline-block;background:'\n    + (LIGHT[intensity] || LIGHT.Suave) + ';box-shadow:0 0 0 ' + Math.round(d/3) + 'px ' + (HALO[intensity] || HALO.Suave);\n}\n\nclass Component extends DCLogic {\n  state = { rows: [], intensity:'Todas', query:'', faq:0, picks:[], copied:false };\n\n  componentDidMount(){\n    const CANCIONES = [\n  [\"Freedom\",\"Allen Stone\",\"Media\",true],\n  [\"Taste Of You (live at Sound Emporium)\",\"Allen Stone ft. Jamie Lidell\",\"Suave\",true],\n  [\"La Cintura\",\"Álvaro Soler\",\"Media\",false],\n  [\"Irresponsables\",\"Babasónicos\",\"Media\",false],\n  [\"Yes Sir, I Can Boogie\",\"Baccara\",\"Media\",false],\n  [\"Ay Amor\",\"Bahiano\",\"Suave\",false],\n  [\"Clávame tu amor\",\"Banda Registrada\",\"Media\",true],\n  [\"Qué bonito\",\"Banda XXI\",\"Media\",false],\n  [\"Copacabana\",\"Barry Manilow\",\"Media\",false],\n  [\"Me Voy\",\"Bersuit Vergarabat\",\"Media\",false],\n  [\"Blame It On the Boogie\",\"Big Fun\",\"Alta\",false],\n  [\"Dancing With Myself\",\"Billy Idol\",\"Alta\",true],\n  [\"All Shook Up\",\"Billy Joel\",\"Alta\",false],\n  [\"Blinding Lights\",\"The Weeknd\",\"Alta\",false],\n  [\"Somos Dos\",\"Bomba Estéreo\",\"Media\",false],\n  [\"24K Magic\",\"Bruno Mars\",\"Alta\",true],\n  [\"Finesse\",\"Bruno Mars\",\"Alta\",true],\n  [\"I Just Might\",\"Bruno Mars\",\"Media\",true],\n  [\"Treasure\",\"Bruno Mars\",\"Alta\",true],\n  [\"Canción De Luna\",\"Buenas Tardes\",\"Suave\",false],\n  [\"Love Will Keep Us Together\",\"Captain & Tennille\",\"Media\",false],\n  [\"That Man\",\"Caro Emerald\",\"Media\",false],\n  [\"Salomé\",\"Chayanne\",\"Media\",false],\n  [\"Astros\",\"Ciro y Los Persas\",\"Media\",true],\n  [\"A mil\",\"Cruzando El Charco\",\"Media\",false],\n  [\"Terminales\",\"Cruzando El Charco\",\"Suave\",true],\n  [\"Oye El Boom\",\"David Bisbal\",\"Alta\",false],\n  [\"Just a Gigolo\",\"David Lee Roth\",\"Media\",false],\n  [\"Baile\",\"David Otero\",\"Media\",false],\n  [\"Amigos Raros A Punto\",\"Delfina Campos\",\"Media\",true],\n  [\"The Boss\",\"Diana Ross\",\"Alta\",true],\n  [\"Levitating (feat. DaBaby)\",\"Dua Lipa\",\"Media\",false],\n  [\"One Kiss\",\"Dua Lipa y Calvin Harris\",\"Media\",false],\n  [\"Boogie Wonderland\",\"Earth, Wind & Fire\",\"Alta\",false],\n  [\"September\",\"Earth, Wind & Fire\",\"Alta\",false],\n  [\"I'm Still Standing\",\"Elton John\",\"Media\",false],\n  [\"Bailando\",\"Enrique Iglesias, Descemer Bueno, Gente De Zona\",\"Media\",false],\n  [\"The Loco-Motion\",\"Everynight\",\"Media\",false],\n  [\"Hot2Touch\",\"Felix Jaehn, Hight, Alex Aiono\",\"Alta\",false],\n  [\"Relax\",\"Frankie Goes to Hollywood\",\"Alta\",false],\n  [\"I Was Born To Love You\",\"Freddie Mercury\",\"Alta\",false],\n  [\"Love Kills\",\"Freddie Mercury\",\"Alta\",true],\n  [\"Freed From Desire\",\"Gala\",\"Alta\",false],\n  [\"Can't Take My Eyes Off You\",\"Gloria Gaynor\",\"Media\",false],\n  [\"As It Was\",\"Harry Styles\",\"Media\",false],\n  [\"Good Times\",\"Harry Styles\",\"Media\",true],\n  [\"Adrenalina\",\"Jennifer Lopez, Ricky Martin\",\"Alta\",false],\n  [\"Grandes Bolas de Fuego\",\"Jerry Lee Lewis\",\"Alta\",false],\n  [\"Can't Stop the Feeling\",\"Justin Timberlake\",\"Alta\",false],\n  [\"Love Never Felt So Good\",\"Justin Timberlake & Michael Jackson\",\"Media\",false],\n  [\"DPM\",\"Kany García\",\"Suave\",false],\n  [\"Givin' Up\",\"Karen Oliver\",\"Media\",false],\n  [\"Si Antes Te Hubiera Conocido\",\"Karol G\",\"Media\",false],\n  [\"I Kissed A Girl\",\"Katy Perry\",\"Media\",false],\n  [\"Ladies Night\",\"Kool & the Gang\",\"Media\",false],\n  [\"A Mi Manera\",\"La Beriso\",\"Suave\",false],\n  [\"Universo Paralelo\",\"La Konga, Nahuel Pennisi\",\"Media\",false],\n  [\"Bulletproof\",\"La Roux, Pomplamoose\",\"Media\",true],\n  [\"Gloria\",\"Laura Branigan\",\"Alta\",true],\n  [\"BZRP\",\"Luck Ra\",\"Media\",false],\n  [\"Moving On Up\",\"M People\",\"Alta\",false],\n  [\"Hay Confusión\",\"Man Ray\",\"Media\",true],\n  [\"Rescata Mi Corazón\",\"Manuel Wirzt\",\"Suave\",false],\n  [\"Uptown Funk\",\"Mark Ronson\",\"Alta\",false],\n  [\"Makes Me Wonder\",\"Maroon 5\",\"Media\",false],\n  [\"Flowers\",\"Miley Cyrus\",\"Media\",false],\n  [\"Fantasmas\",\"Miranda!\",\"Media\",true],\n  [\"These Boots Are Made for Walkin'\",\"Nancy Sinatra\",\"Suave\",false],\n  [\"L-O-V-E\",\"Nat King Cole\",\"Suave\",false],\n  [\"Kissing Strangers\",\"Nicki Minaj\",\"Media\",false],\n  [\"Un Muchacho Como Yo\",\"Palito Ortega\",\"Media\",true],\n  [\"Happy\",\"Pharrell Williams\",\"Media\",false],\n  [\"Don't Stop Me Now\",\"Queen\",\"Alta\",false],\n  [\"Felicidad\",\"Raffaella Carrà\",\"Alta\",false],\n  [\"Pedro\",\"Raffaella Carrà\",\"Alta\",false],\n  [\"Hit The Road Jack\",\"Ray Charles\",\"Media\",false],\n  [\"Don't Worry\",\"Ray Dalton\",\"Media\",false],\n  [\"Come With Me\",\"Ricky Martin\",\"Media\",false],\n  [\"Dame Más\",\"Ricky Martin\",\"Alta\",true],\n  [\"La Mordidita\",\"Ricky Martin\",\"Alta\",false],\n  [\"Vente Pa' Ca\",\"Ricky Martin ft. Maluma\",\"Media\",false],\n  [\"Como le digo\",\"Rodrigo\",\"Alta\",true],\n  [\"You Got It\",\"Roy Orbison\",\"Suave\",true],\n  [\"Dame el fuego de tu amor\",\"Sandro\",\"Media\",true],\n  [\"Smooth\",\"Santana\",\"Media\",false],\n  [\"Man! I Feel Like A Woman\",\"Shania Twain\",\"Alta\",false],\n  [\"Isn't She Lovely\",\"Stevie Wonder\",\"Suave\",false],\n  [\"If You Love Somebody Set Them Free\",\"Sting\",\"Media\",true],\n  [\"Ciudad Mágica\",\"Tan Biónica\",\"Media\",false],\n  [\"Tú y Yo\",\"Thalía\",\"Suave\",true],\n  [\"Muñequita Linda\",\"Thalía ft. Robbie Williams\",\"Suave\",false],\n  [\"I'm So Excited\",\"The Pointer Sisters\",\"Alta\",false],\n  [\"You're No Good\",\"The Rise of Gru (soundtrack)\",\"Alta\",false],\n  [\"Disco Inferno\",\"The Trams\",\"Alta\",false],\n  [\"Timber (ft. Kesha)\",\"Pitbull\",\"Alta\",false],\n  [\"Put a Lid On It\",\"Squirrel Nut Zippers\",\"Media\",false],\n  [\"No se llama amor\",\"Turf\",\"Media\",false],\n  [\"Loco un poco\",\"Turf\",\"Media\",false],\n  [\"YMCA\",\"Village People\",\"Alta\",false],\n  [\"Wadu Wadu\",\"Virus\",\"Alta\",false],\n  [\"I'm Your Baby Tonight\",\"Whitney Houston\",\"Media\",false],\n  [\"No voy en tren\",\"Charly García\",\"Media\",false]\n];\n    this.setState({rows: CANCIONES.map((r, i) => ({id:i, song:r[0], artist:r[1], intensity:r[2], ready:r[3]}))});\n  }\n\n  norm(t){\n    return (t || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/['’´`.,!¡?¿()-]/g,'');\n  }\n\n  filtered(){\n    const q = this.norm(this.state.query.trim());\n    return this.state.rows.filter(p =>\n      (this.state.intensity === 'Todas' || p.intensity === this.state.intensity) &&\n      (!q || this.norm(p.song + ' ' + p.artist).includes(q))\n    );\n  }\n\n  toggle(id){\n    this.setState(st => ({\n      copied: false,\n      picks: st.picks.includes(id) ? st.picks.filter(x => x !== id) : st.picks.concat([id])\n    }));\n  }\n\n  renderVals(){\n    const s = this.state;\n    const list = this.filtered();\n    const n = s.picks.length;\n    const byId = id => s.rows.find(r => r.id === id);\n    const hit = n === 3 || n === 5 || n === 10;\n    const next = hit ? null : [3,5,10].find(t => t > n) || null;\n    const falta = next ? next - n : 0;\n\n    return {\n      visible: list.map(p => {\n        const on = s.picks.includes(p.id);\n        return Object.assign({}, p, {\n          dotStyle: dot(p.intensity),\n          rowStyle: ROW_BASE + (on ? 'background:#F3EADC;' : ''),\n          checkStyle: 'text-align:right;font:600 13px \\'Work Sans\\',system-ui,sans-serif;transition:.15s;'\n            + (on ? 'color:#B4552E;opacity:1;' : 'color:rgba(34,30,26,.2);opacity:.45;'),\n          toggle: () => this.toggle(p.id)\n        });\n      }),\n      isEmpty: s.rows.length > 0 && list.length === 0,\n      resultLabel: s.rows.length === 0\n        ? 'Cargando el catálogo…'\n        : (list.length === s.rows.length\n            ? s.rows.length + ' canciones · tocá las que te gusten'\n            : list.length + (list.length === 1 ? ' canción' : ' canciones') + ' de ' + s.rows.length),\n      query: s.query,\n      setQuery: e => this.setState({query: e.target.value}),\n      clearFilters: () => this.setState({intensity:'Todas', query:''}),\n      levels: ['Todas','Suave','Media','Alta'].map(l => ({\n        label: l,\n        pick: () => this.setState({intensity:l}),\n        dotStyle: l === 'Todas' ? 'display:none' : dot(l, 8),\n        style: 'display:flex;align-items:center;gap:9px;cursor:pointer;padding:10px 17px;border-radius:100px;font:500 12px \\'Work Sans\\',system-ui,sans-serif;transition:.15s;'\n          + (s.intensity === l\n              ? 'background:#221E1A;color:#FAF5EE;border:1px solid #221E1A;'\n              : 'background:#FFFDFA;color:rgba(34,30,26,.6);border:1px solid rgba(34,30,26,.12);')\n      })),\n      legend: [\n        {t:'Suave', d:'para principiantes', i:'Suave'},\n        {t:'Media', d:'con algo de base', i:'Media'},\n        {t:'Alta', d:'nivel avanzado', i:'Alta'}\n      ].map(l => ({t:l.t, d:l.d, dotStyle: dot(l.i, 8)})),\n      openIg: e => {\n        if(e && e.preventDefault) e.preventDefault();\n        const url = 'https://www.instagram.com/marilynasonline/';\n        const w = window.open(url, '_blank', 'noopener');\n        if(!w){ try { window.top.location.href = url; } catch(_){ window.location.href = url; } }\n      },\n      hasPicks: n > 0,\n      picked: s.picks.map(id => byId(id)).filter(Boolean).map(p => ({\n        song: p.song,\n        remove: () => this.toggle(p.id)\n      })),\n      pickHeadline: n === 1 ? 'Elegiste 1 canción' : 'Elegiste ' + n + ' canciones',\n      pickHint: falta\n        ? (falta === 1 ? 'Te falta 1 para el pack de ' + next : 'Te faltan ' + falta + ' para el pack de ' + next)\n        : (hit\n            ? '¡Justo el pack de ' + n + '! Mandámela y te paso el precio.'\n            : 'Ya pasaste los 10: hablamos y vemos cómo lo armamos.'),\n      footerPad: n > 0 ? 'padding-bottom:190px' : 'padding-bottom:0',\n      copyLabel: s.copied ? 'Copiada ✓' : 'Copiar lista',\n      copyList: () => {\n        const txt = 'Hola Marilyn! Me gustaron estas:\\n'\n          + s.picks.map(id => byId(id)).filter(Boolean).map((p, i) => (i+1) + '. ' + p.song + ' — ' + p.artist).join('\\n');\n        const done = () => { this.setState({copied:true}); setTimeout(() => this.setState({copied:false}), 2000); };\n        if(navigator.clipboard && navigator.clipboard.writeText){\n          navigator.clipboard.writeText(txt).then(done).catch(done);\n        } else done();\n      },\n      faqs: [\n        {q:'¿Cómo es todo el proceso?', a:'Marcás las que te gusten y se van sumando a una lista. Copiás la lista y me la mandás por privado, te paso el precio y las formas de pago, y cuando el pago se acredita te llega el link con los videos.'},\n        {q:'¿Qué son los colorcitos?', a:'Te ayudan a elegir según tu grupo: verde para principiantes, amarillo para quienes ya tienen algo de base, y rojo para nivel avanzado. Es la dificultad de la coreo, no el estilo de música.'},\n        {q:'¿Puedo llevarme una sola?', a:'Por ahora no, van en packs de 3, 5 o 10. Elegís las que quieras del catálogo y armamos el tuyo, no hay combos fijos.'},\n        {q:'¿Cuándo me llegan los videos?', a:'En cuanto se acredita el pago te mando un link privado y los bajás a tu compu o celu. Son archivos MP4, quedan tuyos para siempre y no se vencen.'},\n        {q:'¿Cuánto sale y cómo se paga?', a:'Depende del pack, y prefiero pasártelo por privado según lo que elijas. Se abona antes de recibir los videos: escribime y te digo el valor y las formas de pago.'},\n        {q:'¿Las puedo dar en mis clases?', a:'Sí, para eso están. Podés darlas presencial u online y usarlas en muestras. Lo único que te pido es que me menciones si la subís a redes.'}\n      ].map((f, i) => ({\n        q: f.q, a: f.a,\n        toggle: () => this.setState({faq: s.faq === i ? -1 : i}),\n        iconStyle: 'font-size:19px;font-weight:400;color:#B4552E;transition:transform .2s;flex:none;transform:rotate(' + (s.faq === i ? '45deg' : '0deg') + ')',\n        answerStyle: s.faq === i\n          ? 'margin:0 0 18px;max-width:66ch;font:400 13.5px/1.7 \\'Work Sans\\',system-ui,sans-serif;color:rgba(34,30,26,.62)'\n          : 'display:none;margin:0'\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
